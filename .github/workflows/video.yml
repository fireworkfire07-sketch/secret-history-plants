name: SHP Pipeline

on:
  workflow_dispatch:
    inputs:
      topic:
        description: "Plant or story topic"
        required: true
        default: "Black Pepper"
      upload_to_youtube:
        description: "Upload final video to YouTube"
        required: true
        type: boolean
        default: false
  repository_dispatch:
    types: [new_topic]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Resolve topic and upload settings
        id: resolve
        env:
          DISPATCH_TOPIC: ${{ github.event.client_payload.topic }}
          MANUAL_TOPIC: ${{ inputs.topic }}
          MANUAL_UPLOAD: ${{ inputs.upload_to_youtube }}
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            echo "topic=$DISPATCH_TOPIC" >> "$GITHUB_OUTPUT"
            echo "upload=true" >> "$GITHUB_OUTPUT"
          else
            echo "topic=$MANUAL_TOPIC" >> "$GITHUB_OUTPUT"
            echo "upload=$MANUAL_UPLOAD" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate SHP v2 package
        run: python shp_engine.py
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: llama-3.3-70b-versatile
          VIDEO_TOPIC: ${{ steps.resolve.outputs.topic }}
          VIDEO_MARKET: English-speaking global audience

      - name: Build video without upload
        if: ${{ steps.resolve.outputs.upload != 'true' }}
        run: python pipeline.py
        env:
          SKIP_YOUTUBE_UPLOAD: "true"

      - name: Build and upload video
        if: ${{ steps.resolve.outputs.upload == 'true' }}
        run: python pipeline.py
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}

      - name: Upload test outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shp-output-${{ github.run_number }}
          if-no-files-found: warn
          path: |
            script.txt
            meta.txt
            scenes.json
            scorecard.json
            package.json
            final.mp4
            thumbnail.jpg
            projects/

      - name: Hata bildirimi gonder (Telegram)
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "TELEGRAM_BOT_TOKEN/TELEGRAM_CHAT_ID yok, bildirim atlaniyor."
            exit 0
          fi
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          TEXT=$(printf '⚠️ Workflow basarisiz\nRepo: %s\nWorkflow: %s\nRun: %s' \
            "${{ github.repository }}" "${{ github.workflow }}" "$RUN_URL")
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode chat_id="${TELEGRAM_CHAT_ID}" \
            --data-urlencode text="$TEXT" \
            || echo "Telegram bildirimi gonderilemedi (workflow yine de basarisiz olarak isaretli kalir)."
